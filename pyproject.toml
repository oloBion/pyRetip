[project]
name = "pyRetip"
version = "2.1"
description = "Python library for retention time prediction for metabolomics and lipidomics"

readme = "README.md"
repository = "https://github.com/olobion/pyRetip"
requires-python = ">=3.10"
dependencies = [
    "autogluon-tabular[catboost,fastai,lightgbm,realmlp,skex,tabicl,tabpfn,xgboost]>=1.5.0",
    "bokeh>=3.9.0",
    "h2o>=3.46",
    "joblib>=1.5.3",
    "jupyterlab>=4.5",
    "mordredcommunity>=2.0.7",
    "networkx>=3.4.2",
    "numpy>=2.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3",
    "polars>=1.39.3",
    "pubchempy>=1.0.5",
    "rdkit>=2026.3.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "selenium>=4.42.0",
    "tabdpt>=1.1.13",
    "tqdm>=4.67.3",
    "xgboost>=3.1.3",
]
